name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["master"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-contribution-grid-snake.svg
      - name: Commit snake
        run: |
          git config user.name "yjun"
          git config user.email "yjun@users.noreply.github.com"
          git add dist/github-contribution-grid-snake.svg
          git commit -m "chore: update contribution snake" || echo "no change"
          git push
